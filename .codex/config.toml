[mcp_servers."GitMCP Docs"]
url = "https://gitmcp.io/docs"

[mcp_servers."dotfiles Docs"]
url = "https://gitmcp.io/davidsneighbour/dotfiles"

[mcp_servers."MCP Docs"]
url = "https://gitmcp.io/docs"

[mcp_servers.netlify]
command = "npx"
args = [
    "-y",
    "@netlify/mcp",
]

[mcp_servers.ubuntu-wiki]
command = "bash"
args = [
    "-c",
    'CONFIG="${HOME}/.dotfiles/configs/mcp/ubuntu-wiki.json" exec npx -y @professional-wiki/mediawiki-mcp-server@0.20.1',
]
env = { MCP_LOG_LEVEL = "error" }
