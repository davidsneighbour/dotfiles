---
################################################################################
# Setup configuration for Dotbot
#
# @see https://github.com/anishathalye/dotbot for more info
################################################################################
# AI tooling bootstrap (Ollama and related activation/install commands).

- defaults:
    link:
      create: true
      relink: true
      force: true

- clean: ["~"]

- link:
    ~/.agents:
      path: ${HOME}/github.com/davidsneighbour/dotfiles-protected/ai-configs/agents
    ~/.claude/settings.json:
      path: ${HOME}/github.com/davidsneighbour/dotfiles-protected/ai-configs/claude/settings.json
    ~/.codex/config.toml:
      path: ${HOME}/github.com/davidsneighbour/dotfiles-protected/ai-configs/codex/config.toml
    ~/.copilot:
      path: ${HOME}/github.com/davidsneighbour/dotfiles-protected/ai-configs/copilot
    ~/.gemini:
      path: ${HOME}/github.com/davidsneighbour/dotfiles-protected/ai-configs/gemini
    ~/.hermes:
      path: ${HOME}/github.com/davidsneighbour/dotfiles-protected/ai-configs/hermes
    ~/.ollama:
      path: ${HOME}/github.com/davidsneighbour/dotfiles-protected/ai-configs/ollama
    # assistant setup
    ~/.claude/CLAUDE.md:
      path: configs/agents/global-agents-instructions.md
    ~/.codex/AGENTS.md:
      path: configs/agents/global-agents-instructions.md

# Third-party agent skills: restore the skills recorded in
# configs/agents/skills-lock.json (never updates them) and link them into
# ~/.claude/skills and ~/.codex/skills. Unmanaged skills stay untouched. A
# missing Node.js/npx, a failed restore, or a name conflict fails this step.
# See configs/agents/README.md.
- shell:
    - description: Restore tracked third-party agent skills and link them for Claude Code and Codex
      command: /bin/bash configs/agents/install-skills.sh --install --yes
      stdin: false
      stdout: true
      stderr: true
