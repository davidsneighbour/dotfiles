---
################################################################################
# Setup configuration for the protected repository
################################################################################
# Protected/private symlinks for secrets, credentials, and local secure assets.

- defaults:
    link:
      create: true
      relink: true
      force: true

- clean: ["~"]

- link:
    ~/.env: protected/.env
    ~/.gmailctl: protected/gmailctl
    ~/.gnupg: protected/.gnupg
    ~/.npmrc: protected/.npmrc
    ~/.sentryclirc: protected/.sentryclirc
    ~/.ssh: protected/.ssh
    ~/.config/Cryptomator: protected/Cryptomator
    ~/.config/transmission: protected/transmission
    ~/.config/filezilla/filezilla.xml: protected/filezilla/filezilla.xml
    ~/.config/filezilla/sitemanager.xml: protected/filezilla/sitemanager.xml
    ~/.config/filezilla/trustedcerts.xml: protected/filezilla/trustedcerts.xml
    ~/.crosspost.env: protected/crosspost.env
    ~/.clockify-cli.yaml: protected/clockify-cli.yaml

    # fonts
    ~/.fonts/AkwePro: protected/fonts/AkwePro
    ~/.fonts/BahnPro: protected/fonts/BahnPro
    ~/.fonts/Panton: protected/fonts/Panton
    ~/.fonts/Tomkin: protected/fonts/Tomkin
    ~/.fonts/Verb: protected/fonts/Verb

- shell:
    -
      description: Fix file rights for keys
      command: |
        chmod 0700 ~/.ssh
        chmod 0600 ~/.ssh/authorized_keys
        chmod 0600 ~/.ssh/id_ed25519
        chmod 0644 ~/.ssh/id_ed25519.pub
        chmod 0600 ~/.ssh/config
        chmod 0700 ~/.ssh/conf.d
        chmod 0600 ~/.ssh/conf.d/*
