---
################################################################################
# Setup configuration for Dotbot
#
# @see https://github.com/anishathalye/dotbot for more info
################################################################################
# Main workstation dotfiles setup (links, tools, cronjobs, and host-specific configs).

- plugins:
    - configs/dotbot/plugins/crontab.py

- defaults:
    link:
      create: true
      relink: true
      force: true

- shell:
    - description: "\e[1;38;5;103mRemoving nvm default packages link (locutus only):\e[0m\e[1;38;5;66m"
      command: |
        target="${HOME}/.nvm/default-packages"
        source_file="${HOME}/.dotfiles/configs/session/npm/default-packages"
        if [[ -L "${target}" && "$(readlink -f "${target}")" == "$(readlink -f "${source_file}")" ]]; then
          rm -- "${target}"
          echo "[INFO] Removed ${target}"
        fi
      quiet: true

- crontab:
    - cron: "15 4 * * 0"
      comment: "weekly Node.js Current update"
      command: mkdir -p "${HOME}/.logs/cron" && ${HOME}/.dotfiles/bashrc/cronjobs/node-update.sh >> "${HOME}/.logs/cron/node-update-$(date +\%Y\%m\%d-\%H\%M\%S).log" 2>&1
