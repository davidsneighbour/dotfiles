---
################################################################################
# Setup configuration for Dotbot
#
# @see https://github.com/anishathalye/dotbot for more info
################################################################################
# AI skill symlinks: every skill directory found under skills/ in each
# SKILL_REPOSITORIES entry (see bashrc/helpers/skillz), linked into every
# agent skill root.
#
# This file is generated by `skillz`. Do not edit it by hand; edit
# SKILL_REPOSITORIES in bashrc/helpers/skillz and re-run `skillz` instead.

- defaults:
    link:
      create: true
      relink: true
      force: true

- shell:
    -
      description: Ensure agent skill roots are real directories, touching only symlinks that resolve into a known skill repository
      command: |
        set -e
        shopt -s nullglob

        is_trusted() {
          case "$1" in
            "${HOME}/github.com/davidsneighbour"/*|"${HOME}/github.com/dnbhq"/*) return 0 ;;
            *) return 1 ;;
          esac
        }

        for dir in ~/.agents/skills ~/.codex/skills ~/.claude/skills; do
          expanded="${dir/#\~/$HOME}"

          if [ -L "${expanded}" ]; then
            resolved="$(readlink -f "${expanded}")"
            if is_trusted "${resolved}"; then
              rm "${expanded}"
            else
              echo "skillz: refusing to touch ${expanded} -> ${resolved} (outside known skill repositories)" >&2
              exit 1
            fi
          fi

          mkdir -p "${expanded}"

          for entry in "${expanded}"/*; do
            [ -L "${entry}" ] || continue
            [ -e "${entry}" ] && continue
            resolved="$(readlink -f "${entry}")"
            is_trusted "${resolved}" && rm "${entry}"
          done
        done

