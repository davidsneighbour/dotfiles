# Global Vale configuration.
#
# Dotbot links this file to ~/.config/vale/.vale.ini, the global config path
# that Vale reports in `vale ls-dirs`. Vale uses it when a project has no
# .vale.ini of its own. Run `vale sync` after you change Packages.
#
# StylesPath is not set: Vale then uses its default, ~/.local/share/vale/styles.
#
# @see https://github.com/davidsneighbour/vale-config

MinAlertLevel = suggestion
Packages = https://github.com/davidsneighbour/vale-config/releases/download/v1.1.0/config.zip

[*.{md,markdown,mdx,adoc,txt,rst,html}]
BasedOnStyles = Vale, DNBWriting, DNBAIPatterns, DNBMillennialisms
