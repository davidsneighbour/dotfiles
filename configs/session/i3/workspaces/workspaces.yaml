workspaces:
  - key: 1
    name: dashboard
    icon: "\uE1C1"
  - key: 2
    name: web
    icon: "\uE0E8"
  - key: 3
    name: code
    icon: ""
  - key: 4
    name: ops
    icon: "\uE154"
  - key: 5
    name: notes
    icon: "\uE595"
  - key: 6
    name: bots
    icon: "\uE1BB"
  - key: 7
    name: dotfiles
    icon: "\uE0D7"
  - key: 8
    name: comms
    icon: "\uE116"
  - key: 9
    name: cookies
    icon: "\uE26B"

dynamic:
  code:
    icon: ""
    workspace_prefix: code
    command:
      - code
      - --new-window
  chatgpt:
    icon: ""
    workspace_prefix: chatgpt
    command:
      - /usr/bin/chatgpt
  claude:
    icon: ""
    workspace_prefix: chatgpt
    command:
      - /usr/bin/claude-desktop

window_icons:
  # Icon for a window whose class/instance matches no rule below.
  fallback: "\uE11D"
  # Window class (or instance) -> workspace icon. Used by promote-focused
  # (Ctrl+Shift+Alt+N) and by launch-command (Rofi, new workspace).
  # Find a class with configs/session/i3/window-inspector.sh. slug is optional.
  # How to add an icon: configs/session/i3/README.md, "Add an icon for a program".
  rules:
    - class: Code
      slug: code
      icon: ""
    - class: firefox
      slug: web
      icon: "\uE0E8"
    - class: obsidian
      slug: notes
      icon: "\uE595"
    - class: Sublime_text
      slug: editor
      icon: "\uE23E"
    - class: Thunar
      slug: files
      icon: "\uE33C"
    - class: Xfce4-terminal
      slug: terminal
      icon: "\uE795"
    - class: Terminator
      slug: terminal
      icon: "\uE795"
    - class: Enpass
      slug: enpass
      icon: "\uE6E9"
