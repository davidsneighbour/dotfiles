################################################################################
# Window rules (for_window / assign)
# see SESSION.md, "Window rules", for the full rationale behind each entry.
################################################################################

# IDENTIFIERS
################################################################################

# window-inspector.sh's own report terminal (Ctrl+Shift+Alt+I).
# see configs/session/i3/window-inspector.sh
for_window [window_role="window-inspector"] floating enable, resize set 700 540, move position center

# STARTER DESKTOP
################################################################################

# obsidian
assign [class="obsidian"] $ws5
# for_window [class="obsidian"] move container to workspace $ws5

# Enpass — autostarted by session-starts.conf. Keep it out of normal
# workspaces entirely: mark it, float it, and send it straight to the
# scratchpad as soon as its window appears, so it never sits visible on
# $ws1. Ctrl+Shift+Alt+E (applications.conf) toggles it back in/out via the
# mark. Matched on class+instance, not title: Enpass's login/unlock window
# and its unlocked vault window are the same window, and its title differs
# by locale/state ("Enpass" vs the vault name), so title is not a stable
# match. class="Enpass" instance="Enpass" confirmed via `xprop WM_CLASS` on
# this system's actual window (see SESSION.md, "Window rules", for how to
# re-check this if a future Enpass release changes it). Enpass also opens
# two other, override-redirect windows (an "Enpass Assistant" helper and a
# tiny tray-icon proxy) that share this WM_CLASS but never enter i3's
# window tree at all (confirmed via `i3-msg -t get_tree`), so this rule
# cannot catch them.
for_window [class="Enpass" instance="Enpass"] mark scratch-enpass, floating enable, move scratchpad
