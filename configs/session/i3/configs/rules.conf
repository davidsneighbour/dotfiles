################################################################################
# Window rules (for_window / assign)
# see SESSION.md, "Window rules", for the full rationale behind each entry.
################################################################################

# IDENTIFIERS
################################################################################

# window-inspector.sh's own report terminal (Ctrl+Shift+Alt+I).
# see configs/session/i3/window-inspector.sh
for_window [window_role="window-inspector"] floating enable, resize set 700 540, move position center

# msgvault polybar module's manual-sync terminal (click-left). Distinguished
# from ordinary Terminator windows by WM_WINDOW_ROLE=msgvault-sync (set via
# `terminator --role`, same mechanism as window-inspector.sh above). Only
# floated here — size/position is pinned by tools/msgvault/sync-terminal
# itself (twice, after the window is confirmed mapped), because Terminator's
# auto-applied "default" layout fights a one-shot for_window resize/move.
for_window [window_role="msgvault-sync"] floating enable

# Scratch terminal (Ctrl+Shift+Alt+T): a persistent, singleton Terminator
# instance, distinguished from ordinary $mod+Return Terminator windows by
# WM_WINDOW_ROLE=scratch-terminal (set via `terminator --role`, same
# mechanism as window-inspector.sh above). Marked, floated, and sent
# straight to the scratchpad as soon as it maps, so it never sits visible
# on a normal workspace until explicitly summoned. See
# configs/session/terminal/scratch-terminal, which targets this mark for
# every subsequent show/hide/geometry operation rather than re-matching on
# window_role.
for_window [window_role="scratch-terminal"] mark scratch-terminal, floating enable, move scratchpad

# Clockify Polybar form. Opened by tools/clockify through Chrome's app mode
# with a dedicated user-data-dir and stable WM_CLASS.
for_window [class="dnb-clockify-form"] floating enable, resize set 700 760, move position center, focus

# STARTER DESKTOP
################################################################################

# obsidian
assign [class="obsidian"] $ws5
# for_window [class="obsidian"] move container to workspace $ws5

# Enpass — autostarted by session-starts.conf. Keep it out of normal
# workspaces entirely: mark it, float it, and send it straight to the
# scratchpad as soon as its window appears, so it never sits visible on
# $ws1. Ctrl+Shift+Alt+E (applications.conf) toggles it back in/out via the
# mark. Matched on class+instance, not title: Enpass's login/unlock window
# and its unlocked vault window are the same window, and its title differs
# by locale/state ("Enpass" vs the vault name), so title is not a stable
# match. class="Enpass" instance="Enpass" confirmed via `xprop WM_CLASS` on
# this system's actual window (see SESSION.md, "Window rules", for how to
# re-check this if a future Enpass release changes it). Enpass also opens
# two other, override-redirect windows (an "Enpass Assistant" helper and a
# tiny tray-icon proxy) that share this WM_CLASS but never enter i3's
# window tree at all (confirmed via `i3-msg -t get_tree`), so this rule
# cannot catch them.
for_window [class="Enpass" instance="Enpass"] mark scratch-enpass, floating enable, move scratchpad
