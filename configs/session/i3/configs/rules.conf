################################################################################
# Window rules (for_window / assign)
#
# Kept in its own file so it stays easy to scan as it grows — see
# SESSION.md, "Window rules", for the full rationale behind each entry.
################################################################################

# window-inspector.sh's own report terminal (Ctrl+Shift+Alt+I). Matched on
# WM_WINDOW_ROLE, set via `terminator --role=window-inspector`, so this
# never matches a normal terminator window.
for_window [window_role="window-inspector"] floating enable, resize set 700 540, move position center
