################################################################################
# Session startup
#
# Every exec_always here MUST be non-fatal: a missing script or failing
# helper must never take down the rest of the session. Backgrounding (&)
# plus `|| true`/`|| :` on the i3 exec line keeps a bad exit status from
# doing anything i3 would notice.
################################################################################

# (Re)registers the GNOME Keyring's PKCS#11 and Secret Service
# (org.freedesktop.secrets) D-Bus components on this session's bus. PAM
# (pam_gnome_keyring.so `auto_start` in /etc/pam.d/lightdm) already starts
# and unlocks the daemon at login for every session, including this one, but
# that happens before the X session's D-Bus bus exists, so those two D-Bus
# services never get registered. XFCE papers over this with
# X-XFCE-Autostart-Override gnome-keyring `.desktop` entries that
# xfce4-session processes from ~/.config/autostart; i3 has no session
# manager reading that directory at all (dotfiles no longer manages an XDG
# autostart pool either way — see SESSION.md), so without this line apps
# that use libsecret (e.g. VS Code's credential storage) find no keyring
# under i3.
# gnome-keyring-daemon attaches to the already-running PAM instance (same
# control directory) instead of starting a second one, so this is safe to
# re-run on every restart.
exec_always --no-startup-id sh -c "/usr/bin/gnome-keyring-daemon --start --components=pkcs11,secrets || true"

# Guaranteed-visible root background so the desktop never looks "empty" even
# with no wallpaper image configured (see SESSION.md "Background").
exec_always --no-startup-id xsetroot -solid '#0B0D0F'

# Polybar, restarted cleanly on every i3 restart. The launcher itself
# handles killing old instances, logging, and failing without touching i3;
# the `|| true` here is a second safety net at the i3 level.
exec_always --no-startup-id sh -c "$HOME/.dotfiles/configs/session/polybar/launch.sh || true"

# Enpass
# Plain `exec`, not `exec_always`: this should start once per session, not
# relaunch (and re-prompt for its master password) on every i3-msg restart.
exec --no-startup-id sh -c "/opt/enpass/Enpass --minimize || true"

# KVM with Barrier
exec --no-startup-id sh -c "/usr/bin/barrier || true"

# xss-lock: hooks configs/session/i3lock/lock.sh up as the screen locker for
# both $mod+L (bound to `loginctl lock-session`, see keybindings.conf) and
# systemd-logind's sleep signal, so the screen is locked *before* the system
# suspends (lid close, power button, `systemctl suspend`) — not just on an
# explicit keypress. Plain `exec`, not `exec_always`: xss-lock is a
# long-running daemon that should start once per session, not be relaunched
# (and potentially duplicated) on every `i3-msg restart` — same rationale as
# the Enpass line above. xss-lock does not fork itself (see `man xss-lock`),
# so it is backgrounded here with `&`; i3's `exec` does not wait for it
# either way, but the daemon would otherwise hold this line's shell open.
exec --no-startup-id sh -c "/usr/bin/xss-lock --transfer-sleep-lock -- $HOME/.dotfiles/configs/session/i3lock/lock.sh & || true"

# Display Wallpaper
exec_always --no-startup-id sh -c "/usr/bin/feh --bg-fill $HOME/.dotfiles/configs/session/i3/wallpaper.jpg || true"

# Window decorations
exec --no-startup-id sh -c "/usr/bin/picom --config $HOME/.config/picom/picom.conf || true"
