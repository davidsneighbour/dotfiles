# Maintain the dark preference; this does not change the i3 desktop identity.
# Failure is reported on stderr and is non-fatal to i3.
exec_always --no-startup-id sh -c "$HOME/.dotfiles/bashrc/helpers/session-colour-scheme --apply || true"

################################################################################
# Session startup
#
# Every exec_always here MUST be non-fatal: a missing script or failing
# helper must never take down the rest of the session. Backgrounding (&)
# plus `|| true`/`|| :` on the i3 exec line keeps a bad exit status from
# doing anything i3 would notice.
################################################################################

# (Re)registers the GNOME Keyring's PKCS#11 and Secret Service
# (org.freedesktop.secrets) D-Bus components on this session's bus. PAM
# (pam_gnome_keyring.so `auto_start` in /etc/pam.d/lightdm) already starts
# and unlocks the daemon at login for every session, including this one, but
# that happens before the X session's D-Bus bus exists, so those two D-Bus
# services never get registered. i3 has no session manager that reads XDG
# autostart, so without this line apps that use libsecret (e.g. VS Code's
# credential storage) find no keyring under i3.
# gnome-keyring-daemon attaches to the already-running PAM instance (same
# control directory) instead of starting a second one, so this is safe to
# re-run on every restart.
exec_always --no-startup-id sh -c "/usr/bin/gnome-keyring-daemon --start --components=pkcs11,secrets || true"

# Polkit authentication agent (mate-polkit). Without one, i3 has no graphical
# agent, so pkexec (and apps that call it, e.g. myna-config) fails with "Error
# creating textual authentication agent". Plain `exec`: only one agent can
# register per session.
exec --no-startup-id sh -c "/usr/libexec/polkit-mate-authentication-agent-1 || true"

# Guaranteed-visible root background so the desktop never looks "empty" even
# with no wallpaper image configured (see SESSION.md "Background").
exec_always --no-startup-id xsetroot -solid '#17191B'

# Polybar, restarted cleanly on every i3 restart. The launcher itself
# handles killing old instances, logging, and failing without touching i3;
# the `|| true` here is a second safety net at the i3 level.
exec_always --no-startup-id sh -c "$HOME/.dotfiles/configs/session/polybar/launch.sh || true"

# Enpass
# Plain `exec`, not `exec_always`: this should start once per session, not
# relaunch (and re-prompt for its master password) on every i3-msg restart.
# Launch through the shared colour-scheme helper for the Enpass-only
# desktop identity override. Ctrl+Shift+Alt+E opens its assistant.
exec --no-startup-id "$HOME/.dotfiles/bashrc/helpers/session-colour-scheme --tool enpass -- --minimize"

# KVM with Barrier
exec --no-startup-id sh -c "/usr/bin/barrier || true"

# Discord (deb package, /usr/bin/discord). Plain `exec`: start once per
# session, minimised to the tray, not on every i3-msg restart.
exec --no-startup-id sh -c "/usr/bin/discord --start-minimized || true"

# WhatsApp: use the same workspace/icon wrapper as the Rofi launcher.
# Plain exec starts once per login; chrome-app reuses an existing window.
exec --no-startup-id sh -c '"${HOME}/.dotfiles/configs/session/i3/workspaces/workspaces.py" launch-command -- "${HOME}/.local/bin/chrome-app" --app whatsapp || true'

# xss-lock: hooks configs/session/i3/lock.sh up as the screen locker for
# both $mod+L (bound to `loginctl lock-session`, see keybindings.conf) and
# systemd-logind's sleep signal, so the screen is locked *before* the system
# suspends (lid close, power button, `systemctl suspend`) — not just on an
# explicit keypress.
#
# xss-lock runs as the systemd --user unit
# configs/session/systemd/xss-lock.service (Restart=on-failure), so it is
# restarted if it dies. `exec_always`, not `exec`: `systemctl --user start`
# on an already-running unit is a safe no-op, so re-running it on every
# `i3-msg restart` re-arms it if it died without ever duplicating it.
#
# The unit passes xss-lock `-s "${XDG_SESSION_ID}"` (see the unit file for
# why: this system lingers, so `systemctl --user` units can't be session-
# located via cgroups). That requires XDG_SESSION_ID to already be in the
# systemd --user manager's own environment before the unit starts — it isn't
# by default, so this imports it every time, immediately before starting the
# unit (same shell, so ordering is guaranteed unlike two separate exec
# lines). DISPLAY and XAUTHORITY are imported too, so xss-lock can always
# connect to this X server. reset-failed clears a failed state or start limit
# left over from an earlier attempt, which would otherwise block the start.
exec_always --no-startup-id sh -c "systemctl --user import-environment DISPLAY XAUTHORITY XDG_SESSION_ID; systemctl --user reset-failed xss-lock.service; systemctl --user start xss-lock.service || true"

# Display Wallpaper
exec_always --no-startup-id sh -c "/usr/bin/feh --bg-fill $HOME/.dotfiles/configs/session/i3/wallpaper.jpg || true"

# Start GDrive
exec --no-startup-id "$HOME/.dotfiles/configs/session/storage/gdrive-mounts.sh || true"

# System checkup (tools/system-checkup), once per session. The delay gives the
# GDrive mounts above time to come up, so the login report is not a false
# alarm. Cron repeats the checkup every 6 hours; Polybar shows failures.
exec --no-startup-id sh -c "sleep 120; $HOME/.dotfiles/tools/system-checkup/system-checkup --quiet || true"
