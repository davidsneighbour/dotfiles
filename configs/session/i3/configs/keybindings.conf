################################################################################
# Applications
################################################################################

bindsym $mod+Return exec $terminal

################################################################################
# Window management
################################################################################

bindsym $mod+Shift+q kill

bindsym $mod+f fullscreen toggle
bindsym $mod+space floating toggle

# Focus
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# Move focused window
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

################################################################################
# Workspaces
################################################################################

bindsym $mod+1 workspace number $ws1
bindsym $mod+2 workspace number $ws2
bindsym $mod+3 workspace number $ws3
bindsym $mod+4 workspace number $ws4
bindsym $mod+5 workspace number $ws5
bindsym $mod+6 workspace number $ws6
bindsym $mod+7 workspace number $ws7
bindsym $mod+8 workspace number $ws8
bindsym $mod+9 workspace number $ws9

bindsym $mod+Shift+1 move container to workspace number $ws1
bindsym $mod+Shift+2 move container to workspace number $ws2
bindsym $mod+Shift+3 move container to workspace number $ws3
bindsym $mod+Shift+4 move container to workspace number $ws4
bindsym $mod+Shift+5 move container to workspace number $ws5
bindsym $mod+Shift+6 move container to workspace number $ws6
bindsym $mod+Shift+7 move container to workspace number $ws7
bindsym $mod+Shift+8 move container to workspace number $ws8
bindsym $mod+Shift+9 move container to workspace number $ws9

################################################################################
# i3 session control
################################################################################

# Reload the configuration file without restarting i3 in-place.
bindsym $mod+Shift+c reload

# Restart i3 in place (preserves layout). exec_always commands above
# (Polybar, background) run again automatically; the Polybar launcher is
# responsible for not leaving duplicate bars behind.
bindsym $mod+Shift+r restart

# Exit i3 (and lock/reboot/shutdown), via the same Rofi power menu XFCE's
# Polybar already uses (configs/session/rofi/power/powermenu.sh, wired to its
# Polybar module's click-left there). Its own listview handles confirmation,
# so this needs no i3-side confirmation step. An i3-nagbar-button confirm
# was tried first and dropped: i3-nagbar does not warp the pointer, so its
# button (top-right, the same strip Polybar's tray/clock occupies) could
# fire on a merely-resting cursor; a keyboard-only i3 "mode" confirm was
# tried next and also dropped: entering a mode grabs all keyboard input
# session-wide with no visible indicator (no i3bar binding_mode module),
# which read as the whole session hanging.
#
# powermenu.sh requires BASHRC_PATH (it sources bashrc/lib/*/*.bash) and
# hard-fails without it. Polybar's i3 launcher (configs/session/polybar/
# launch.sh) exports BASHRC_PATH before starting Polybar, so the powermenu
# module's click-left handler inherits it. This keybinding is a separate
# `exec` invoked directly by i3, not a child of Polybar, so it does not
# inherit that export — i3's `exec` runs commands from i3's own environment,
# which never has BASHRC_PATH (only `.bashrc`/`.profile` export it, and
# `exec` uses a plain, non-interactive, non-login shell) — so it has to be
# set inline here instead.
bindsym $mod+Shift+e exec --no-startup-id sh -c 'BASHRC_PATH="$HOME/.dotfiles/bashrc" "$HOME/.dotfiles/configs/session/rofi/power/powermenu.sh"'

# Lock the screen, independent of the exit power menu above. Goes through
# loginctl (not a direct call to configs/session/i3lock/lock.sh) so xss-lock
# — started in session-starts.conf, which owns lock.sh as its locker — is
# the single place that decides how the screen gets locked, whether that is
# triggered by this key or by the system about to suspend.
bindsym $mod+l exec --no-startup-id loginctl lock-session

################################################################################
# Resize mode (conventional i3 extra, kept small)
################################################################################

mode "resize" {
    bindsym Left resize shrink width 10 px or 10 ppt
    bindsym Down resize grow height 10 px or 10 ppt
    bindsym Up resize shrink height 10 px or 10 ppt
    bindsym Right resize grow width 10 px or 10 ppt

    bindsym Return mode "default"
    bindsym Escape mode "default"
}
bindsym $mod+r mode "resize"
