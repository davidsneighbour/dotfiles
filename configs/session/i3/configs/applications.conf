################################################################################
# Keybindings for applications
# see https://i3wm.org/docs/userguide.html#keybindings
################################################################################

# Launcher (Rofi)
# Super (tap and release) starts the selected program on a new dynamic
# workspace: -run-command/-run-shell-command hand the command to
# workspaces.py launch-command, which creates the workspace and sets its icon
# from workspaces.yaml (dynamic.* command match, else window_icons by window
# class). $mod+Shift+d is the reliable fallback for the bare Super binding.
# $mod+d starts the program on the current workspace.
# NOTE: i3 does not expand a variable inside another `set` value, so each
# command is written out in full.
set $rofi_new_workspace rofi -show drun -config "$HOME/.dotfiles/configs/session/i3/rofi.rasi" -display-drun "start program in new workspace" -run-command "$HOME/.dotfiles/configs/session/i3/workspaces/workspaces.py launch-command -- {cmd}" -run-shell-command "$HOME/.dotfiles/configs/session/i3/workspaces/workspaces.py launch-command -- {terminal} -e {cmd}"
set $rofi_current_workspace rofi -show drun -config "$HOME/.dotfiles/configs/session/i3/rofi.rasi" -display-drun "start program in current workspace"
bindsym --release Super_L exec --no-startup-id $rofi_new_workspace
bindsym $mod+Shift+d exec --no-startup-id $rofi_new_workspace
bindsym $mod+d exec --no-startup-id $rofi_current_workspace

# VS Code workspace picker (Rofi)
bindsym Control+Shift+w exec --no-startup-id sh -c 'BASHRC_PATH="$HOME/.dotfiles/bashrc" "$HOME/.dotfiles/configs/session/rofi/workspaces.sh" --newwindow --dynamic-workspace code'

# Window switcher (Rofi), all workspaces. Mod1 is Alt — i3 has no bare "Alt"
# modifier alias, unlike $mod (Mod4/Super) used everywhere else in this
# config.
bindsym Mod1+Tab exec --no-startup-id "$HOME/.dotfiles/configs/session/rofi/window-switcher.sh"

# Programs. MUST use Control+Shift+Mod1+<key> (Ctrl+Shift+Alt), never bare
# Control+Shift+<key> — see .agents/instructions/session/
# i3-keybindings.instructions.md, "Program-launch bindings" for why.
#
# Obsidian: assigned to its own workspace (rules.conf: `assign [class=
# "obsidian"] $ws5`), so this binding only has to launch/focus it.
bindsym Control+Shift+Mod1+o exec --no-startup-id sh -c '/opt/Obsidian/obsidian vault=notes'
bindsym Control+Shift+Mod1+s exec --no-startup-id sh -c '/usr/bin/subl'

# Window inspector: click a window, see its WM_CLASS/role/title/PID/geometry
# in a floating terminal (see window-inspector.sh and configs/rules.conf).
bindsym Control+Shift+Mod1+i exec --no-startup-id "$HOME/.dotfiles/configs/session/i3/window-inspector.sh"

# Promote focused window: move the currently focused managed window to a new
# temporary icon-labelled workspace. The workspace icon is selected from
# configs/session/i3/workspaces/workspaces.yaml's window_icons rules, with a
# fallback when no class/instance rule matches.
bindsym Control+Shift+Mod1+n exec --no-startup-id "$HOME/.dotfiles/configs/session/i3/workspaces/workspaces.py promote-focused"

# Canonical Files workspace: show it (create it on first use, otherwise
# switch to the existing one — see configs/session/filemanager/README.md).
# All Thunar launching, window marking, layout, and external-open handling
# lives in the controller; this binding only invokes it.
bindsym Control+Shift+Mod1+f exec --no-startup-id "$HOME/.dotfiles/configs/session/filemanager/file-manager --show"

# Scratch terminal: toggle a persistent, singleton Terminator in/out of the
# scratchpad on the current workspace. Unlike Enpass, this needs more than
# a bare `scratchpad show` — it must create the window on first use and
# recalculate right-half-of-output geometry on every show, so it is
# delegated to a dedicated controller rather than living inline here. See
# configs/session/terminal/README.md and configs/session/terminal/scratch-
# terminal. Distinct from $mod+Return, which still opens ordinary,
# non-persistent Terminator windows.
bindsym Control+Shift+Mod1+t exec --no-startup-id "$HOME/.dotfiles/configs/session/terminal/scratch-terminal --toggle"

# * add Keyboard shortcuts for retained shared helpers if needed:
# * bash -lc "${HOME}/.dotfiles/bashrc/helpers/interface-restart"
# * /home/patrick/.dotfiles/configs/session/rofi/workspaces.sh --newwindow
# * subl


# Enpass
bindsym Control+Shift+Mod1+e exec --no-startup-id "$HOME/.dotfiles/bashrc/helpers/session-colour-scheme --tool enpass -- showassistant"
