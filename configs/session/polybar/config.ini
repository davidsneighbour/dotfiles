; i3 starter Polybar bar.
;
; A trimmed-down copy of configs/system/polybar/ (the XFCE bar), kept
; separate so this file can never affect the live XFCE session. See
; configs/session/polybar/README.md and the repo-root SESSION.md.
include-directory = configs

[bar/i3bar]
background = ${colours.background}
foreground = ${colours.foreground}

font-0 = "${fonts.text}"
font-1 = "${fonts.icons-lucide}"
font-2 = "${fonts.text-condensed}"
font-3 = "${fonts.icons-nerd}"
font-4 = "${fonts.icons-brands}"

height = 30
width = 100%
line-size = 1

; Left: i3 workspaces. Centre: focused window title. Right: system status.
modules-left = powermenu i3
modules-center = title
modules-right = cpu memory filesystem network pulseaudio date tray

spacing = 0
module-margin = 1

wm-name = polybar-i3bar
enable-ipc = false
