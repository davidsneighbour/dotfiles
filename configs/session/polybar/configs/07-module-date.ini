[module/date]
# https://github.com/polybar/polybar/wiki/Module:-date
# Use a module click handler instead of wrapping the label in a `%{A...}`
# formatting tag. The URL can then stay out of Polybar's colon-delimited
# action-tag syntax.
type = internal/date
interval = 1

; https://en.cppreference.com/w/cpp/io/manip/put_time
date = "%A, %B %d %Y"
time = "%l:%M %p"
format = <label>
click-left = xdg-open https://calendar.google.com/

format-background = ${colours.background}
format-foreground = ${colours.foreground}
format-padding = 4

label = "%date% %time%"
label-foreground = ${colours.red}
