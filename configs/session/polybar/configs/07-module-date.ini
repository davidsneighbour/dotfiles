[module/date]
# https://github.com/polybar/polybar/wiki/Module:-date
# Simplified from configs/system/polybar/configs/07-module-date.ini: no
# click-to-open-calendar action, so there is no unescaped-URL backslash for
# polybar to complain about (`polybar -d ... i3bar` flagged that value).
type = internal/date
interval = 1

; https://en.cppreference.com/w/cpp/io/manip/put_time
date = "%A, %B %d %Y"
time = "%l:%M %p"
format = %{A1:xdg-open https\://calendar.google.com/:}<label>%{A}

format-background = ${colours.background}
format-foreground = ${colours.foreground}
format-padding = 4

label = "%date% %time%"
label-foreground = ${colours.red}
