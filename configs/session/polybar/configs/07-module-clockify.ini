[module/clockify]
type = custom/ipc

hook-0 = ~/.dotfiles/configs/session/clockify/polybar-clockify --status
initial = 1

format = <label>
label = %output%

click-left = ~/.dotfiles/configs/session/clockify/polybar-clockify --open-form
click-right = xdg-open https://app.clockify.me/tracker

[module/clockify-refresh]
type = custom/script
hidden = true

exec = polybar-msg action clockify hook 0 >/dev/null 2>&1
interval = 300
