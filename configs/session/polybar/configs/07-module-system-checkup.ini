; System checkup indicator (tools/system-checkup). Shows nothing while all
; checks pass. A red icon with the failure count means checks failed; an
; orange icon means the last checkup is older than 13 hours.
; Left click opens the last report. Right click runs the checks again.
[module/system-checkup]
type = custom/script

exec = ${HOME}/.dotfiles/tools/system-checkup/system-checkup --status-line
interval = 30

click-left = ${HOME}/.dotfiles/tools/system-checkup/system-checkup --show-report &
click-right = ${HOME}/.dotfiles/tools/system-checkup/system-checkup --quiet &

format = <label>
label = %output%
