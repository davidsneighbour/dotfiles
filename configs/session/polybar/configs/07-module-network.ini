[module/network]
# https://github.com/polybar/polybar/wiki/Module:-network
# Interface name is host-specific. Confirmed via `ip -brief link` on
# locutus: `eno1` is the wired interface currently UP. If this config is
# reused on another host, or this host's interface changes, update
# `interface` below (see SESSION.md "Known limitations" for host-specific
# config as a documented next step, not solved here).
type = internal/network
interface = eno1
interval = 3

format-connected = <label-connected>
format-connected-padding = 4
label-connected = NET %downspeed% / %upspeed%
label-connected-foreground = ${colours.foreground}

; A missing/renamed interface degrades this module only, not the whole bar.
format-disconnected = <label-disconnected>
label-disconnected = NET down
label-disconnected-foreground = ${colours.comment}
