[module/filesystem]
# https://github.com/polybar/polybar/wiki/Module:-filesystem
type = internal/fs
interval = 30

mount-0 = /

format-mounted = <label-mounted>
format-mounted-padding = 0
label-mounted =  %percentage_used%%

; Shown instead of format-mounted if a mount point is not mounted. Kept so a
; missing/unmounted "/" (should not happen, but see spec: optional/hardware
; things must not break the whole bar) degrades to text, not a bar crash.
format-unmounted = <label-unmounted>
label-unmounted =  n/a
label-unmounted-foreground = ${colours.comment}
