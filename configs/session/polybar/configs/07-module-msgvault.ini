[module/msgvault]
type = custom/script

exec = ${HOME}/.dotfiles/tools/msgvault/indicator.sh --issues-file ${HOME}/.config/polybar/issues.toml --settings-file ${HOME}/.dotfiles/configs/session/polybar/configs/01-colours.ini --log-dir ${HOME}/.logs/msgvault --healthy-window-minutes 5 --show-unread
interval = 60

click-left = xfce4-terminal --title "msgvault sync" --command "${HOME}/.dotfiles/tools/msgvault/manual-sync.sh --pause-on-exit --verbose"

format-padding = 2
