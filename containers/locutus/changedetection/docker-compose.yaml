---
services:
  changedetection:
    # secretlint-disable-next-line @secretlint/secretlint-rule-secp256k1-privatekey
    image: ghcr.io/dgtlmoon/changedetection.io:latest@sha256:04eaae7915bad711160cb15abe160f6d3fabe98bbbd658509d4b7a654000fb2d
    container_name: changedetection
    hostname: changedetection
    restart: unless-stopped

    ports:
      - "3060:5000"

    volumes:
      - ./data:/datastore

    environment:
      TZ: Asia/Bangkok
      PLAYWRIGHT_DRIVER_URL: ws://browser-sockpuppet-chrome:3000
      HIDE_REFERER: "true"

    depends_on:
      browser-sockpuppet-chrome:
        condition: service_started

  browser-sockpuppet-chrome:
    # secretlint-disable-next-line @secretlint/secretlint-rule-secp256k1-privatekey
    image: dgtlmoon/sockpuppetbrowser:latest@sha256:1d8f72d2ce2085faed4232e5ae1e65c02efe5b831a18e127829b267c260b4fb2
    container_name: changedetection-browser
    hostname: browser-sockpuppet-chrome
    restart: unless-stopped

    cap_add:
      - SYS_ADMIN

    environment:
      SCREEN_WIDTH: "1920"
      SCREEN_HEIGHT: "1080"
      SCREEN_DEPTH: "24"
      MAX_CONCURRENT_CHROME_PROCESSES: "10"
