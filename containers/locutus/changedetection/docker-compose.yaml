---
services:
  changedetection:
    # secretlint-disable-next-line @secretlint/secretlint-rule-secp256k1-privatekey
    image: ghcr.io/dgtlmoon/changedetection.io:latest@sha256:47b1e9cc3eff820e6022b655e3fcc948625f60c1770ae8b9c30aa3bf104dc255
    container_name: changedetection
    hostname: changedetection
    restart: unless-stopped

    ports:
      - "3060:5000"

    volumes:
      - ./data:/datastore

    environment:
      TZ: Asia/Bangkok
      PLAYWRIGHT_DRIVER_URL: ws://browser-sockpuppet-chrome:3000
      HIDE_REFERER: "true"

    depends_on:
      browser-sockpuppet-chrome:
        condition: service_started

  browser-sockpuppet-chrome:
    # secretlint-disable-next-line @secretlint/secretlint-rule-secp256k1-privatekey
    image: dgtlmoon/sockpuppetbrowser:latest@sha256:453381bb697b8b54e33ed20cee64d444b0a86885c9dc8a2ffbed27ef2b6c153a
    container_name: changedetection-browser
    hostname: browser-sockpuppet-chrome
    restart: unless-stopped

    cap_add:
      - SYS_ADMIN

    environment:
      SCREEN_WIDTH: "1920"
      SCREEN_HEIGHT: "1080"
      SCREEN_DEPTH: "24"
      MAX_CONCURRENT_CHROME_PROCESSES: "10"
