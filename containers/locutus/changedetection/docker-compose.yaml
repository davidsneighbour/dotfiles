---
services:
  changedetection:
    # secretlint-disable-next-line @secretlint/secretlint-rule-secp256k1-privatekey
    image: ghcr.io/dgtlmoon/changedetection.io:latest@sha256:b6aae2572a0bf1a671b1b202365ddcfe16a31fa8a60be89df606705731b55f8b
    container_name: changedetection
    hostname: changedetection
    restart: unless-stopped

    ports:
      - "3060:5000"

    volumes:
      - ./data:/datastore

    environment:
      TZ: Asia/Bangkok
      PLAYWRIGHT_DRIVER_URL: ws://browser-sockpuppet-chrome:3000
      HIDE_REFERER: "true"

    depends_on:
      browser-sockpuppet-chrome:
        condition: service_started

  browser-sockpuppet-chrome:
    # secretlint-disable-next-line @secretlint/secretlint-rule-secp256k1-privatekey
    image: dgtlmoon/sockpuppetbrowser:latest@sha256:6f681d418f1fb4215ce3720968790b63fdd2385a087bafd90e37a812f16e66da
    container_name: changedetection-browser
    hostname: browser-sockpuppet-chrome
    restart: unless-stopped

    cap_add:
      - SYS_ADMIN

    environment:
      SCREEN_WIDTH: "1920"
      SCREEN_HEIGHT: "1080"
      SCREEN_DEPTH: "24"
      MAX_CONCURRENT_CHROME_PROCESSES: "10"
