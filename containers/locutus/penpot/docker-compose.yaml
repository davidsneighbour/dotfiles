---
name: penpot

# https://help.penpot.app/technical-guide/getting-started/docker/
# Local Locutus changes:
#   - web UI is published on 127.0.0.1:3030
#   - uploaded assets and Postgres data are bind-mounted under ./assets
#   - Mailcatcher remains internal; no HTTP inbox is published on the host
x-flags: &penpot-flags
  PENPOT_FLAGS: disable-email-verification disable-secure-session-cookies enable-mcp enable-smtp

x-uri: &penpot-public-uri
  PENPOT_PUBLIC_URI: ${PENPOT_PUBLIC_URI:-http://localhost:3030}

x-body-size: &penpot-http-body-size
  PENPOT_HTTP_SERVER_MAX_BODY_SIZE: 367001600

x-secret-key: &penpot-secret-key
  PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY:?set PENPOT_SECRET_KEY in .env}

networks:
  penpot:

services:
  penpot-frontend:
    # secretlint-disable-next-line @secretlint/secretlint-rule-secp256k1-privatekey
    image: penpotapp/frontend:2.17@sha256:861989dfff50f12b9de1358c6b0f3cc1e601d7a678db2826f3643d0f93438500
    container_name: penpot-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3030:8080"
    volumes:
      - ./assets/files:/opt/data/assets
    depends_on:
      - penpot-backend
      - penpot-exporter
      - penpot-mcp
    networks:
      - penpot
    environment:
      <<: [*penpot-flags, *penpot-http-body-size, *penpot-public-uri]

  penpot-backend:
    # secretlint-disable-next-line @secretlint/secretlint-rule-secp256k1-privatekey
    image: penpotapp/backend:2.17@sha256:471cdebf185be899ef7d7593e9cd7994b908ebd7ffb78ca547e3d843bb83536f
    container_name: penpot-backend
    restart: unless-stopped
    volumes:
      - ./assets/files:/opt/data/assets
    depends_on:
      penpot-postgres:
        condition: service_healthy
      penpot-valkey:
        condition: service_healthy
    networks:
      - penpot
    environment:
      <<: [*penpot-flags, *penpot-public-uri, *penpot-http-body-size, *penpot-secret-key]
      PENPOT_DATABASE_URI: postgresql://penpot-postgres/penpot
      PENPOT_DATABASE_USERNAME: penpot
      PENPOT_DATABASE_PASSWORD: ${PENPOT_DATABASE_PASSWORD:?set PENPOT_DATABASE_PASSWORD in .env}
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
      PENPOT_TELEMETRY_ENABLED: "false"
      PENPOT_SMTP_DEFAULT_FROM: ${PENPOT_SMTP_DEFAULT_FROM:-no-reply@localhost}
      PENPOT_SMTP_DEFAULT_REPLY_TO: ${PENPOT_SMTP_DEFAULT_REPLY_TO:-no-reply@localhost}
      PENPOT_SMTP_HOST: penpot-mailcatch
      PENPOT_SMTP_PORT: 1025
      PENPOT_SMTP_TLS: "false"
      PENPOT_SMTP_SSL: "false"

  penpot-mcp:
    # secretlint-disable-next-line @secretlint/secretlint-rule-secp256k1-privatekey
    image: penpotapp/mcp:2.17@sha256:185a1d255a9580cc9e3ad858b51a1246d17fc44e9ab76bc7a685649f3c8ecfc9
    container_name: penpot-mcp
    restart: unless-stopped
    networks:
      - penpot

  penpot-exporter:
    # secretlint-disable-next-line @secretlint/secretlint-rule-secp256k1-privatekey
    image: penpotapp/exporter:2.17@sha256:7e8beb6ef2bdb9d778e9bbcbf7feebf8c99a137b2d9eb3969450c0a1a49e41c5
    container_name: penpot-exporter
    restart: unless-stopped
    depends_on:
      penpot-valkey:
        condition: service_healthy
    networks:
      - penpot
    environment:
      <<: [*penpot-secret-key, *penpot-public-uri]
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0

  penpot-postgres:
    # secretlint-disable-next-line @secretlint/secretlint-rule-secp256k1-privatekey
    image: postgres:18@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    container_name: penpot-postgres
    restart: unless-stopped
    stop_signal: SIGINT
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penpot"]
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 2s
    volumes:
      - ./assets/postgres:/var/lib/postgresql/data
    networks:
      - penpot
    environment:
      - POSTGRES_INITDB_ARGS=--data-checksums
      - POSTGRES_DB=penpot
      - POSTGRES_USER=penpot
      - POSTGRES_PASSWORD=${PENPOT_DATABASE_PASSWORD:?set PENPOT_DATABASE_PASSWORD in .env}

  penpot-valkey:
    # secretlint-disable-next-line @secretlint/secretlint-rule-secp256k1-privatekey
    image: valkey/valkey:8.1@sha256:495e4fecdc98ee48a20b207726caa5ab6451e0fac3642a9be10d9e70b3068df6
    container_name: penpot-valkey
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - penpot
    environment:
      - VALKEY_EXTRA_FLAGS=--maxmemory 128mb --maxmemory-policy volatile-lfu

  penpot-mailcatch:
    # secretlint-disable-next-line @secretlint/secretlint-rule-secp256k1-privatekey
    image: sj26/mailcatcher:latest@sha256:5d153a4daadf0c266f29c3856085741f06ca1e3768671f4267622d3e3ffe5564
    container_name: penpot-mailcatch
    restart: unless-stopped
    expose:
      - "1025"
    networks:
      - penpot
