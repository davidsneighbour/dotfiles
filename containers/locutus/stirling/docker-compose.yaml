---
services:
  stirling-pdf:
    # secretlint-disable-next-line @secretlint/secretlint-rule-secp256k1-privatekey
    image: stirlingtools/stirling-pdf:3.2.0-fat@sha256:b77d4fd0bb067bc03f0ca133ae551febaada9f1d0a1db915970dc0e35558dff3
    container_name: stirling-pdf
    ports:
      - '3010:8080'
    volumes:
      - ./data:/configs
      - ./logs:/logs
      - ./pipeline:/pipeline
      - ./tessdata:/usr/share/tessdata
    environment:
      SYSTEM_DEFAULTLOCALE: en-GB
    restart: unless-stopped
