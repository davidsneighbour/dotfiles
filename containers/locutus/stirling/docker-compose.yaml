---
services:
  stirling-pdf:
    # secretlint-disable-next-line @secretlint/secretlint-rule-secp256k1-privatekey
    image: stirlingtools/stirling-pdf:3.2.2-fat@sha256:b63cd013fcd242210b137d6ac5aeb9fcf4c5cb9d4e004b8a3e3185fcd57d3c9e
    container_name: stirling-pdf
    ports:
      - '3010:8080'
    volumes:
      - ./data:/configs
      - ./logs:/logs
      - ./pipeline:/pipeline
      - ./tessdata:/usr/share/tessdata
    environment:
      SYSTEM_DEFAULTLOCALE: en-GB
    restart: unless-stopped
