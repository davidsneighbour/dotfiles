---
services:
  homepage:
    # secretlint-disable-next-line @secretlint/secretlint-rule-secp256k1-privatekey
    image: ghcr.io/gethomepage/homepage:latest@sha256:3e38fe788223cb46a3ce1f046ef11667b40f7707fdca0dcbfa3f86c5c42bf1e8
    container_name: homepage
    ports:
      - 3005:3000
    volumes:
      - ${CONFIG}:/app/config
      - ${DIR}/images:/app/public/images
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      # Wildcard is intentional and local-only: the host is reached under
      # several local names/IPs (container name, LAN IP, Tailscale name) and
      # is not exposed to the public internet.
      HOMEPAGE_ALLOWED_HOSTS: "*"
