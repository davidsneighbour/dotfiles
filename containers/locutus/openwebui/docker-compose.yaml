---
services:
  open-webui:
    # secretlint-disable-next-line @secretlint/secretlint-rule-secp256k1-privatekey
    image: ghcr.io/open-webui/open-webui:v0.11.0@sha256:72c0ba641ba75e7aa52655cb242570906ececd09b1140fb736483038a22b3228
    container_name: open-webui
    restart: unless-stopped

    ports:
      - "3200:8080"

    # https://docs.openwebui.com/reference/env-configuration
    environment:
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      # Auth and signup are disabled intentionally: this instance is bound to
      # a private LAN-only host with no public exposure, so there is no
      # untrusted network path that would need per-user login.
      WEBUI_AUTH: "False"
      ENABLE_SIGNUP: "False"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY in .env}
      USER_AGENT: "Mozilla/5.0 (Windows NT 11.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.1.7578.115 Safari/537.36"
      # Lower the timeout (default is 10 seconds) for faster failover
      # makes sense for local networks, but can be increased for remote servers
      AIOHTTP_CLIENT_TIMEOUT_MODEL_LIST: 3

    volumes:
      - ./data:/app/backend/data

    extra_hosts:
      - "host.docker.internal:host-gateway"
