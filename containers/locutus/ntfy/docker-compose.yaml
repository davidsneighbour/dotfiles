---
services:
  ntfy:
    # secretlint-disable-next-line @secretlint/secretlint-rule-secp256k1-privatekey
    image: binwiederhier/ntfy:latest@sha256:59250e1d8be2ee2186c4560322f625faef22ace380331f05b63f8842dbd62602
    container_name: ntfy
    command:
      - serve
    environment:
      TZ: Asia/Bangkok
    user: "1000:1000"
    volumes:
      - ./cache:/var/cache/ntfy
      - ./config:/etc/ntfy:ro
    ports:
      - 3040:80
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q --tries=1 http://localhost:80/v1/health -O -
          | grep -Eo '"healthy"\s*:\s*true' || exit 1
      interval: 10m
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
