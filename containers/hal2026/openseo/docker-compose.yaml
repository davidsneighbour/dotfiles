---
# OpenSEO standalone Docker edition.
# @see https://github.com/every-app/open-seo/blob/main/docs/SELF_HOSTING_DOCKER.md
# @see https://github.com/every-app/open-seo/blob/main/deploy/standalone/compose.yaml
#
# Adapted from upstream deploy/standalone/compose.yaml for hal2026:
#
# - Nginx is published on all interfaces at port 3010 (upstream: 127.0.0.1:3001).
# - AUTH_MODE defaults to local_noauth. Password mode requires an HTTPS
#   BETTER_AUTH_URL, except on loopback, and hal2026.local is plain HTTP.
# - Data stays in named volumes. Upstream backup and restore tooling
#   (scripts/celld/backup.mjs) reads the named volumes behind service mounts,
#   and the web-config volume needs the `nocopy` option.
#
# - Run 'cp .env.template .env' and set STORAGE_SECRET_KEY and DATAFORSEO_API_KEY.
# - Run 'docker compose pull'.
# - Run 'docker compose up -d'.
# - Run 'docker compose logs -f init' and wait for 'OpenSEO initialized and ready.'
name: openseo

x-app: &app
  # secretlint-disable-next-line @secretlint/secretlint-rule-secp256k1-privatekey
  image: ghcr.io/every-app/open-seo-standalone:latest@sha256:ed3d63c9be4e29bcbfe23c575633e8ca35fab9a9c8c0293464dcd70e6606070b

x-storage: &storage
  CELLD_BUCKET: openseo
  S3_ENDPOINT: http://storage:9000
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?Set STORAGE_ACCESS_KEY in .env}
  AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY in .env}

services:
  storage:
    # RustFS is the S3-compatible store that celld keeps its state in.
    # secretlint-disable-next-line @secretlint/secretlint-rule-secp256k1-privatekey
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY}
    volumes:
      - storage:/data
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/health]
      interval: 5s
      timeout: 3s
      retries: 20

  runtime:
    <<: *app
    environment:
      <<: *storage
      CELLD_MAX_RSS_MB: "1536"
      CELLD_MAX_RESIDENT_CELLS: "64"
      CELLD_V8_HEAP_LIMIT_MB: "256"
      CELLD_MAX_REQUEST_BODY_BYTES: "33554432"
      RUST_LOG: warn,cell_console=info
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - runtime:/data
      - config:/config:ro
    depends_on:
      storage:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/api/health]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 5

  # Runs once at each start: generates secrets on the first run, loads the
  # app, and applies database migrations. It exits by design.
  init:
    <<: *app
    command: [sh, /opt/standalone/init.sh]
    network_mode: service:runtime
    environment:
      <<: *storage
      AUTH_MODE: ${AUTH_MODE:-local_noauth}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3010}
      CONTEXT_API_KEY: ${CONTEXT_API_KEY:-}
      DATAFORSEO_API_KEY: ${DATAFORSEO_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      CRAWLER_ACCESS_SECRET: ${CRAWLER_ACCESS_SECRET:-}
    volumes:
      - config:/config
      - web-config:/web-config
    depends_on:
      runtime:
        condition: service_started
    restart: "no"

  crawl-gateway:
    <<: *app
    command: [node, /opt/standalone/crawl-gateway.mjs]
    volumes:
      - config:/config:ro
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    # secretlint-disable-next-line @secretlint/secretlint-rule-secp256k1-privatekey
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    ports:
      # <Host Port>:<Container Port>
      - "3010:80"
    # Written by init from the site config in the app image. nocopy keeps
    # Nginx's own default.conf (root-owned) out of the shared volume.
    volumes:
      - type: volume
        source: web-config
        target: /etc/nginx/conf.d
        read_only: true
        volume:
          nocopy: true
    depends_on:
      init:
        condition: service_completed_successfully
      crawl-gateway:
        condition: service_started
    restart: unless-stopped

volumes:
  storage:
  runtime:
  config:
  web-config:
