---
# @see https://github.com/paperless-ngx/paperless-ngx
#
# SQLite is used as the database. The SQLite file is stored in the `paperless_data` volume.
#
# - Run 'docker compose pull'.
# - Run 'docker compose up -d'.

services:

  broker:
    # secretlint-disable-next-line @secretlint/secretlint-rule-secp256k1-privatekey
    image: docker.io/library/redis:8@sha256:4764ce37931aac77c0d033680b339b19b4a4a81772204d268947cb851212d0ac
    restart: unless-stopped
    volumes:
      - redisdata:/data

  webserver:
    # secretlint-disable-next-line @secretlint/secretlint-rule-secp256k1-privatekey
    image: ghcr.io/paperless-ngx/paperless-ngx:latest@sha256:7c1d98afd200def9e2bad3a377d30829e8d486554b3c818995af5860114ea17f
    restart: unless-stopped
    depends_on:
      - broker
      - gotenberg
      - tika
    ports:
      - 3010:8000
    volumes:
      - data:/usr/src/paperless/data
      - ./media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
      - /mnt/storage/Paperless/consume:/usr/src/paperless/consume
    env_file: docker-compose.env
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998

  gotenberg:
    # secretlint-disable-next-line @secretlint/secretlint-rule-secp256k1-privatekey
    image: docker.io/gotenberg/gotenberg:8.35@sha256:a16a14e1f18a71405624bc028e90d4ef50ea774c352b303639c10bf7b141f760
    restart: unless-stopped
    # The gotenberg chromium route is used to convert .eml files. We do not
    # want to allow external content like tracking pixels or even javascript.
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"

  tika:
    # secretlint-disable-next-line @secretlint/secretlint-rule-secp256k1-privatekey
    image: docker.io/apache/tika:latest@sha256:b99f19c4fd76237dafe7d22f719b9bddfa9a449da687c597a41e2f6d9a595418
    restart: unless-stopped

volumes:
  redisdata:
  data:
